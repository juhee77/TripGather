plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.4'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'TripGather Backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'
	
	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	
	// Flyway
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// QueryDSL
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
	annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"

	// Dotenv
	implementation 'io.github.cdimascio:dotenv-java:3.1.0'

	// MinIO
	implementation 'io.minio:minio:8.5.7'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Jacoco 설정
jacoco {
	toolVersion = "0.8.11"
}

// 커버리지 측정 제외 대상 (리포트와 게이트가 같은 범위를 보도록 한 곳에서 정의)
// QueryDSL 생성 클래스, 부트스트랩 클래스, 그리고 자체 로직이 없는 데이터/설정/조회 계층.
ext.coverageExcludes = [
	"**/Q*",
	"**/*Application*",
	"**/*dto*",
	"**/*domain*",
	"**/*config*",
	"**/*repository*"
]

jacocoTestReport {
	reports {
		xml.required = true
		csv.required = false
		html.required = true
	}
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: project.ext.coverageExcludes)
		}))
	}
}

jacocoTestCoverageVerification {
	dependsOn test // 검증은 최신 테스트 실행 결과(jacoco exec)를 기준으로 수행
	afterEvaluate {
		// BUNDLE 규칙은 클래스 단위 excludes 가 적용되지 않으므로,
		// 측정 대상 자체를 리포트와 동일한 범위로 좁혀 둔다.
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: project.ext.coverageExcludes)
		}))
	}
	violationRules {
		// [규칙 1] 서비스 계층 - 핵심 비즈니스 로직
		rule {
			element = 'CLASS'
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.80
			}
			excludes = [
				"**.Q*",
				"**.*Application*",
				"**.*dto*",
				"**.*domain*",
				"**.*config*",
				"**.*repository*",
				"**.exception*",
				"**.security*",
				"**.*Controller*"
			]
		}

		// [규칙 2] 인증/예외 처리 및 API 계층
		//   - security: JWT 필터/STOMP 연결 인증/소셜 로그인(oauth 하위 포함)
		//   - exception: 전역 예외 응답 변환
		//   - controller: REST/STOMP 엔드포인트
		rule {
			element = 'CLASS'
			includes = [
				"com.example.demo.security.*",
				"com.example.demo.exception.*",
				"com.example.demo.controller.*"
			]
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.80
			}
		}

		// [규칙 3] 분기(BRANCH) 커버리지 하한선 - 후퇴 방지용 래칫
		// 라인 커버리지는 메서드를 한 번만 호출해도 채워지지만, 조건문의 반대 경로는
		// 검증되지 않은 채 남는다. 전체 기준으로 분기 커버리지 바닥을 고정해 두고
		// 개선될 때마다 이 수치를 올린다. (현재 82.7%)
		rule {
			element = 'BUNDLE'
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = 0.80
			}
		}
	}
}

// Querydsl 설정부
def generated = 'src/main/generated'

tasks.withType(JavaCompile) {
	options.getGeneratedSourceOutputDirectory().set(file(generated))
}

sourceSets {
	main.java.srcDirs += [ generated ]
}

clean {
	delete file(generated)
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport // 테스트 완료 후 리포트 생성
}

// check(= build) 에 연결해야 CI 에서 커버리지 규칙이 실제로 강제된다.
// (test 의존은 위 jacocoTestCoverageVerification 블록에 이미 선언되어 있다)
tasks.named('check') {
	dependsOn jacocoTestCoverageVerification
}
